name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless cosign signing needs an OIDC token.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      - name: gate on lint and race-enabled tests
        run: |
          mise run lint
          mise run race
      - name: verify packages before publishing (snapshot build + deb install/remove cycle)
        run: mise run package-verify
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish APT repository on GitHub Pages
        uses: peternewman/apt-repo-action@ff037894ae6f9a6a40c56f0993d083adc23b7986
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: |
            amd64
            arm64
          repo_supported_version: stable
          file: dist/*.deb
          file_target_version: stable
          public_key: ${{ secrets.APT_SIGNING_PUBLIC }}
          private_key: ${{ secrets.APT_SIGNING_PRIVATE }}
          key_passphrase: ${{ secrets.APT_SIGNING_PASSPHRASE }}
